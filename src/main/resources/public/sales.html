
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Management | Poultry Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Poultry Management System</h1>
        <p>Manage your poultry farm sales.</p>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="flocks.html">Flocks</a></li>
                <li><a href="feed.html">Feed Management</a></li>
                <li><a href="eggs.html">Egg Production</a></li>
                <li><a href="sales.html" aria-current="page">Sales</a></li>
                <li><a href="expenses.html">Expenses</a></li>
                <li><a href="records.html">Farm Records</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="form-section">
            <h2>Record Sale</h2>

            <form id="saleForm">

                <label for="itemType">Item Sold</label>
                <select id="itemType">
                    <option value="Eggs">Eggs</option>
                    <option value="Broiler Chickens">Broiler Chickens</option>
                </select>

                <label for="saleQuantity">Quantity</label>
                <input type="number" id="saleQuantity" min="1" required>

                <label for="unitPrice">Unit Price (K)</label>
                <input type="number" id="unitPrice" min="0" step="0.01" required>

                <label for="saleDate">Date</label>
                <input type="date" id="saleDate" required>

                <button type="submit">Save Sale</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Poultry Management System. All rights reserved.</p>
    </footer>

    <script src="app.js" defer></script>

</body>
</html>
